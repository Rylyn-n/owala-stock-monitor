name: 庫存檢查

on:
  schedule:
    # 每 10 分鐘一次。GitHub 排程常有數分鐘延遲，屬正常現象。
    - cron: '*/10 * * * *'
  workflow_dispatch:        # 允許在 Actions 頁面手動觸發

# 讓 GITHUB_TOKEN 有權限把更新後的 JSON 推回 repo
permissions:
  contents: write

# 前一次還沒跑完就被下一次排程觸發時，排隊而不是併行（避免 push 衝突）
concurrency:
  group: stock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行庫存檢查
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
          PRODUCT_URL: https://www.finders.com.tw/products/owala-sway-30oz-golf
        run: python monitor.py

      - name: 寫回狀態檔
        run: |
          git config user.name  "stock-monitor[bot]"
          git config user.email "stock-monitor@users.noreply.github.com"
          git add data/stock_status.json
          if git diff --staged --quiet; then
            echo "狀態沒有變化，不需要 commit"
            exit 0
          fi
          git commit -m "chore: 更新庫存狀態 $(date -u '+%Y-%m-%d %H:%M UTC')"
          # 排程重疊時遠端可能已經前進，先 rebase 再推
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "第 $i 次推送失敗，重試中"
            sleep 5
          done
          exit 1
